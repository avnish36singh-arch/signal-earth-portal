[build]
  command = "python build/build_countries.py && python build/build_notes.py && python tests/verify_site_integrity.py"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Block internal docs directory from web access
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# Form landing and legacy redirects
